server:
  port: 9081

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# resilience4j fallback & openfeign
spring:
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
      circuitbreaker:
        enabled: true
  datasource:
    username: root
    password: 123
    url: jdbc:mysql://localhost:3306/e-learning-users?createDatabaseIfNotExist=true
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show-sql: true
    hibernate:
      ddl-auto: update

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 5s